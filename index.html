<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Nexo — Vos experts IA</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#f4a261">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nexo">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080810;
  --bg2: #0d0d18;
  --card: rgba(255,255,255,.04);
  --card-solid: #12121e;
  --border: rgba(255,255,255,.08);
  --text: #f0f0f8;
  --muted: #5a5a78;
  --gold: #f4a261;
  --gold2: #e76f51;
  --sofia: #34d399;
  --marcus: #60a5fa;
  --luna: #a78bfa;
  --alex: #fb923c;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  background:var(--bg);color:var(--text);
  font-family:'DM Sans',sans-serif;
  min-height:100vh;max-width:480px;margin:0 auto;overflow-x:hidden;
}

/* Animated background */
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 600px 400px at 80% -10%, rgba(244,162,97,.06) 0%, transparent 70%),
    radial-gradient(ellipse 400px 400px at -10% 60%, rgba(96,165,250,.05) 0%, transparent 70%),
    radial-gradient(ellipse 300px 300px at 50% 100%, rgba(167,139,250,.04) 0%, transparent 70%);
  pointer-events:none;
}

/* ── AUTH ── */
#auth-screen{
  position:fixed;inset:0;z-index:500;
  background:var(--bg);
  display:flex;flex-direction:column;
  max-width:480px;margin:0 auto;
  overflow-y:auto;
}

.auth-hero{
  position:relative;padding:52px 24px 32px;
  overflow:hidden;
}

.auth-glow-1{
  position:absolute;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(244,162,97,.14),transparent 70%);
  top:-100px;right:-60px;pointer-events:none;
  animation:glow-pulse 4s ease-in-out infinite;
}
.auth-glow-2{
  position:absolute;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(167,139,250,.1),transparent 70%);
  bottom:-40px;left:-40px;pointer-events:none;
  animation:glow-pulse 5s ease-in-out infinite reverse;
}
@keyframes glow-pulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}

.auth-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(244,162,97,.08);
  border:1px solid rgba(244,162,97,.18);
  border-radius:30px;padding:5px 14px;
  font-size:.62rem;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--gold);
  font-family:'JetBrains Mono',monospace;margin-bottom:22px;
}
.live-dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--gold);box-shadow:0 0 6px var(--gold);
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}

.auth-logo{
  font-family:'Syne',sans-serif;font-weight:800;
  font-size:3.4rem;letter-spacing:-.07em;
  line-height:1;margin-bottom:6px;
}
.auth-logo .logo-nex{color:var(--text);}
.auth-logo .logo-o{
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}

.auth-sub{
  font-size:.95rem;color:var(--muted);
  font-weight:300;line-height:1.6;margin-bottom:28px;
}
.auth-sub strong{color:rgba(240,240,248,.8);font-weight:500;}

/* Price comparison */
.price-compare{
  display:grid;grid-template-columns:1fr 1fr;
  gap:10px;margin-bottom:28px;
}
.pc{
  border-radius:16px;padding:14px 16px;
  position:relative;overflow:hidden;
}
.pc-nexo{
  background:linear-gradient(135deg,rgba(244,162,97,.1),rgba(231,111,81,.06));
  border:1px solid rgba(244,162,97,.2);
}
.pc-nexo::before{
  content:'';position:absolute;inset:0;border-radius:16px;
  background:linear-gradient(135deg,rgba(244,162,97,.06),transparent);
}
.pc-gpt{
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.06);
}
.pc-label{
  font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:5px;
}
.pc-price{
  font-family:'Syne',sans-serif;font-weight:800;
  font-size:1.6rem;letter-spacing:-.04em;
}
.pc-nexo .pc-price{
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.pc-gpt .pc-price{color:rgba(255,255,255,.2);text-decoration:line-through;}
.pc-desc{font-size:.68rem;color:var(--muted);margin-top:3px;}
.pc-nexo .pc-desc{color:rgba(244,162,97,.6);}
.pc-badge{
  position:absolute;top:10px;right:10px;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:#000;font-size:.55rem;font-weight:700;
  padding:2px 7px;border-radius:10px;letter-spacing:.05em;
}

.auth-experts{display:flex;flex-direction:column;gap:7px;margin-bottom:4px;}
.ae{
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.03);border:1px solid var(--border);
  border-radius:12px;padding:9px 12px;
}
.ae-icon{
  width:28px;height:28px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:.9rem;flex-shrink:0;
}
.ae-sofia .ae-icon{background:rgba(52,211,153,.12);}
.ae-marcus .ae-icon{background:rgba(96,165,250,.12);}
.ae-luna .ae-icon{background:rgba(167,139,250,.12);}
.ae-alex .ae-icon{background:rgba(251,146,60,.12);}
.ae-info{flex:1;}
.ae-name{font-size:.8rem;font-weight:600;font-family:'Syne',sans-serif;}
.ae-sofia .ae-name{color:var(--sofia);}
.ae-marcus .ae-name{color:var(--marcus);}
.ae-luna .ae-name{color:var(--luna);}
.ae-alex .ae-name{color:var(--alex);}
.ae-role{font-size:.68rem;color:var(--muted);}
.ae-check{font-size:.7rem;color:var(--gold);}

/* Auth form */
.auth-box{
  background:rgba(255,255,255,.03);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  padding:28px 24px 44px;flex:1;
}
.auth-tabs{
  display:flex;gap:3px;margin-bottom:24px;
  background:rgba(255,255,255,.04);
  border-radius:12px;padding:3px;
}
.auth-tab{
  flex:1;padding:9px;text-align:center;
  font-weight:500;font-size:.8rem;border-radius:10px;
  cursor:pointer;transition:.2s;color:var(--muted);
}
.auth-tab.active{background:rgba(255,255,255,.08);color:var(--text);}
.auth-field{margin-bottom:13px;}
.auth-field label{
  display:block;font-size:.65rem;font-weight:500;
  color:var(--muted);margin-bottom:6px;
  letter-spacing:.08em;text-transform:uppercase;
  font-family:'JetBrains Mono',monospace;
}
.auth-field input{
  width:100%;padding:13px 16px;
  background:rgba(255,255,255,.05);
  border:1.5px solid rgba(255,255,255,.08);
  border-radius:14px;color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:.9rem;
  outline:none;transition:.25s;
}
.auth-field input:focus{
  border-color:rgba(244,162,97,.35);
  background:rgba(244,162,97,.04);
  box-shadow:0 0 0 4px rgba(244,162,97,.06);
}
.auth-field input::placeholder{color:#2a2a3a;}
.btn-auth{
  width:100%;padding:15px;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  border:none;border-radius:14px;
  font-family:'Syne',sans-serif;font-weight:700;
  font-size:.95rem;color:#000;cursor:pointer;
  transition:.25s;margin-top:8px;
  box-shadow:0 8px 32px rgba(244,162,97,.25);
}
.btn-auth:hover{opacity:.92;transform:translateY(-2px);box-shadow:0 12px 40px rgba(244,162,97,.35);}
.btn-auth:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
.auth-error{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.18);border-radius:12px;padding:10px 14px;font-size:.78rem;color:#f87171;margin-top:12px;display:none;}
.auth-success{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.18);border-radius:12px;padding:10px 14px;font-size:.78rem;color:#34d399;margin-top:12px;display:none;}

/* ── HEADER ── */
header{
  position:sticky;top:0;z-index:200;
  background:rgba(8,8,16,.85);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid rgba(255,255,255,.06);
  padding:14px 20px 12px;
}
.hdr-row{display:flex;align-items:center;justify-content:space-between;}
.logo{
  font-family:'Syne',sans-serif;font-weight:800;
  font-size:1.65rem;letter-spacing:-.06em;
}
.logo .nex{color:var(--text);}
.logo .o{
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.hdr-right{display:flex;align-items:center;gap:10px;}
.plan-pill{font-size:.58rem;font-weight:600;letter-spacing:.12em;padding:4px 10px;border-radius:20px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;}
.plan-pill.free{background:rgba(255,255,255,.06);color:var(--muted);}
.plan-pill.premium{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;}
.avatar-hdr{
  width:32px;height:32px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  display:flex;align-items:center;justify-content:center;
  font-family:'Syne',sans-serif;font-weight:800;font-size:.8rem;color:#000;
  cursor:pointer;box-shadow:0 4px 16px rgba(244,162,97,.3);
}
.credits-row{margin-top:10px;display:flex;align-items:center;gap:10px;}
.cred-track{flex:1;height:2px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;}
.cred-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .6s ease;}
.cred-txt{font-size:.62rem;color:var(--muted);font-family:'JetBrains Mono',monospace;white-space:nowrap;}

/* ── TABS ── */
.tabs{
  display:flex;
  background:rgba(8,8,16,.9);
  border-bottom:1px solid rgba(255,255,255,.06);
  position:relative;z-index:1;
}
.tab{
  flex:1;padding:12px 8px;text-align:center;
  font-weight:500;font-size:.72rem;letter-spacing:.04em;
  color:var(--muted);cursor:pointer;
  border-bottom:2px solid transparent;transition:.2s;
}
.tab.active{color:var(--text);border-bottom-color:var(--gold);}

/* ── HOME ── */
.hero{
  padding:30px 20px 18px;
  position:relative;overflow:hidden;
}
.hero::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(244,162,97,.04) 0%,transparent 100%);
  pointer-events:none;
}
.hero-eyebrow{
  font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--gold);font-family:'JetBrains Mono',monospace;
  margin-bottom:10px;opacity:.7;
}
.hero h2{
  font-family:'Syne',sans-serif;font-weight:800;
  font-size:2rem;line-height:1.08;letter-spacing:-.06em;margin-bottom:10px;
}
.hero h2 em{font-style:normal;color:var(--gold);}
.hero p{font-size:.82rem;color:var(--muted);line-height:1.7;font-weight:300;}

.sec-label{
  padding:24px 20px 10px;
  font-size:.58rem;font-weight:500;letter-spacing:.22em;
  text-transform:uppercase;color:var(--muted);
  font-family:'JetBrains Mono',monospace;
}

/* ── EXPERT CARDS — GLASSMORPHISM ── */
.experts{padding:0 16px;display:flex;flex-direction:column;gap:14px;margin-bottom:32px;}

.expert-card{
  border-radius:24px;overflow:hidden;cursor:pointer;
  transition:.3s cubic-bezier(.34,1.56,.64,1);
  position:relative;
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.08);
}
.expert-card:hover{transform:translateY(-6px) scale(1.01);}
.expert-card:active{transform:translateY(-2px) scale(1);}

/* Halo glow behind card */
.expert-card::before{
  content:'';position:absolute;
  width:200px;height:200px;border-radius:50%;
  top:-60px;left:-40px;
  pointer-events:none;z-index:0;
  filter:blur(40px);opacity:0;
  transition:opacity .4s;
}
.expert-card:hover::before{opacity:1;}
.card-sofia::before{background:var(--sofia);}
.card-marcus::before{background:var(--marcus);}
.card-luna::before{background:var(--luna);}
.card-alex::before{background:var(--alex);}

/* Gradient border on hover */
.expert-card::after{
  content:'';position:absolute;inset:0;border-radius:24px;
  opacity:0;transition:opacity .3s;pointer-events:none;z-index:0;
}
.card-sofia::after{box-shadow:inset 0 0 0 1px rgba(52,211,153,.3),0 20px 60px rgba(52,211,153,.1);}
.card-marcus::after{box-shadow:inset 0 0 0 1px rgba(96,165,250,.3),0 20px 60px rgba(96,165,250,.1);}
.card-luna::after{box-shadow:inset 0 0 0 1px rgba(167,139,250,.3),0 20px 60px rgba(167,139,250,.1);}
.card-alex::after{box-shadow:inset 0 0 0 1px rgba(251,146,60,.3),0 20px 60px rgba(251,146,60,.1);}
.expert-card:hover::after{opacity:1;}

.ec-content{position:relative;z-index:1;}

.ec-top{padding:20px 20px 0;display:flex;align-items:flex-start;gap:16px;}

/* Avatar with halo */
.ec-avatar-wrap{position:relative;flex-shrink:0;}
.ec-avatar{
  width:68px;height:68px;border-radius:18px;
  position:relative;overflow:hidden;
}
.avatar-halo{
  position:absolute;inset:-8px;border-radius:26px;
  opacity:.25;filter:blur(12px);
  transition:opacity .3s,filter .3s;
}
.card-sofia .avatar-halo{background:var(--sofia);}
.card-marcus .avatar-halo{background:var(--marcus);}
.card-luna .avatar-halo{background:var(--luna);}
.card-alex .avatar-halo{background:var(--alex);}
.expert-card:hover .avatar-halo{opacity:.5;filter:blur(16px);}

.avatar-inner{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
.card-sofia .avatar-inner{background:linear-gradient(135deg,#022c22,#064e3b,#065f46);}
.card-marcus .avatar-inner{background:linear-gradient(135deg,#172554,#1e3a8a,#1d4ed8);}
.card-luna .avatar-inner{background:linear-gradient(135deg,#2e1065,#4c1d95,#6d28d9);}
.card-alex .avatar-inner{background:linear-gradient(135deg,#431407,#7c2d12,#c2410c);}

.avatar-shine{
  position:absolute;top:0;left:0;right:0;height:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.12),transparent);
  border-radius:18px 18px 0 0;
}
.avatar-emoji{
  font-size:2.2rem;
  filter:drop-shadow(0 2px 12px rgba(0,0,0,.6));
  position:relative;z-index:1;
}
@keyframes float{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-5px) rotate(2deg)}}
@keyframes float2{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-5px) rotate(-2deg)}}
.float{animation:float 3s ease-in-out infinite;}
.float2{animation:float2 3.5s ease-in-out infinite;}
.float3{animation:float 2.8s ease-in-out infinite .3s;}
.float4{animation:float2 3.2s ease-in-out infinite .6s;}

.ec-info{flex:1;min-width:0;padding-bottom:16px;}
.ec-name{
  font-family:'Syne',sans-serif;font-weight:800;
  font-size:1.15rem;letter-spacing:-.04em;margin-bottom:2px;
}
.card-sofia .ec-name{color:var(--sofia);}
.card-marcus .ec-name{color:var(--marcus);}
.card-luna .ec-name{color:var(--luna);}
.card-alex .ec-name{color:var(--alex);}
.ec-role{
  font-size:.65rem;font-weight:500;letter-spacing:.08em;
  text-transform:uppercase;margin-bottom:8px;
  color:var(--muted);font-family:'JetBrains Mono',monospace;
}
.ec-desc{font-size:.8rem;color:rgba(240,240,248,.45);line-height:1.6;font-weight:300;}

/* Status */
.ec-status{
  position:absolute;top:16px;right:16px;z-index:2;
  display:flex;align-items:center;gap:5px;
  font-size:.58rem;color:var(--muted);
  font-family:'JetBrains Mono',monospace;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  border-radius:20px;padding:3px 8px;
}
.status-dot{width:5px;height:5px;border-radius:50%;animation:pulse 2s infinite;}
.card-sofia .status-dot{background:var(--sofia);box-shadow:0 0 6px var(--sofia);}
.card-marcus .status-dot{background:var(--marcus);box-shadow:0 0 6px var(--marcus);}
.card-luna .status-dot{background:var(--luna);box-shadow:0 0 6px var(--luna);}
.card-alex .status-dot{background:var(--alex);box-shadow:0 0 6px var(--alex);}

.ec-bottom{
  padding:12px 20px 16px;
  display:flex;align-items:center;justify-content:space-between;
  border-top:1px solid rgba(255,255,255,.06);
}
.ec-tags{display:flex;gap:5px;flex-wrap:wrap;}
.ec-tag{
  font-size:.58rem;padding:3px 9px;border-radius:20px;
  font-weight:500;font-family:'JetBrains Mono',monospace;
  border:1px solid;
}
.card-sofia .ec-tag{background:rgba(52,211,153,.08);color:var(--sofia);border-color:rgba(52,211,153,.15);}
.card-marcus .ec-tag{background:rgba(96,165,250,.08);color:var(--marcus);border-color:rgba(96,165,250,.15);}
.card-luna .ec-tag{background:rgba(167,139,250,.08);color:var(--luna);border-color:rgba(167,139,250,.15);}
.card-alex .ec-tag{background:rgba(251,146,60,.08);color:var(--alex);border-color:rgba(251,146,60,.15);}
.ec-cta{
  font-size:.72rem;font-weight:600;
  display:flex;align-items:center;gap:4px;flex-shrink:0;
  transition:.2s;
}
.card-sofia .ec-cta{color:var(--sofia);}
.card-marcus .ec-cta{color:var(--marcus);}
.card-luna .ec-cta{color:var(--luna);}
.card-alex .ec-cta{color:var(--alex);}
.expert-card:hover .ec-cta{gap:8px;}

/* ── PRICING ── */
.pricing-section{padding:0 16px 32px;}
.pricing-card{
  border-radius:24px;padding:28px;
  position:relative;overflow:hidden;
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(20px);
  border:1px solid rgba(244,162,97,.15);
  box-shadow:0 0 80px rgba(244,162,97,.06);
}
.pricing-card::before{
  content:'';position:absolute;
  width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,rgba(244,162,97,.1),transparent);
  top:-100px;right:-80px;pointer-events:none;
  animation:glow-pulse 5s ease-in-out infinite;
}
.pr-eyebrow{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-family:'JetBrains Mono',monospace;margin-bottom:12px;opacity:.8;}
.pr-title{font-family:'Syne',sans-serif;font-weight:800;font-size:1.4rem;color:var(--text);letter-spacing:-.04em;margin-bottom:6px;}
.pr-price{font-family:'Syne',sans-serif;font-weight:800;font-size:2.8rem;letter-spacing:-.06em;margin-bottom:22px;background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.pr-price span{font-size:1rem;font-weight:400;color:var(--muted);-webkit-text-fill-color:var(--muted);}
.pr-feats{display:flex;flex-direction:column;gap:10px;margin-bottom:26px;}
.pr-feat{display:flex;gap:10px;align-items:flex-start;font-size:.82rem;color:rgba(240,240,248,.55);line-height:1.4;font-weight:300;}
.pr-feat-icon{color:var(--gold);flex-shrink:0;font-size:.85rem;}
.btn-gold{
  width:100%;padding:16px;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  border:none;border-radius:14px;
  font-family:'Syne',sans-serif;font-weight:700;font-size:.95rem;
  color:#000;cursor:pointer;transition:.25s;
  box-shadow:0 8px 32px rgba(244,162,97,.25);
}
.btn-gold:hover{opacity:.92;transform:translateY(-2px);box-shadow:0 12px 40px rgba(244,162,97,.35);}
.pr-note{text-align:center;font-size:.65rem;color:var(--muted);margin-top:12px;}

.testi-wrap{padding:0 16px 32px;display:flex;flex-direction:column;gap:10px;}
.testi{
  background:rgba(255,255,255,.03);backdrop-filter:blur(10px);
  border:1px solid var(--border);border-radius:18px;padding:16px;
}
.testi-stars{color:var(--gold);font-size:.7rem;margin-bottom:7px;letter-spacing:2px;}
.testi-text{font-size:.8rem;line-height:1.65;margin-bottom:10px;color:rgba(240,240,248,.6);font-weight:300;}
.testi-author{font-size:.62rem;color:var(--muted);font-family:'JetBrains Mono',monospace;}

/* ── CHAT ── */
#chat-view{
  display:none;flex-direction:column;
  position:fixed;inset:0;z-index:300;
  max-width:480px;margin:0 auto;background:var(--bg);
}
.chat-hdr{
  padding:12px 16px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0;
  background:rgba(8,8,16,.9);backdrop-filter:blur(24px);
}
.back-btn{
  width:36px;height:36px;border-radius:12px;
  background:rgba(255,255,255,.06);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:1rem;flex-shrink:0;color:var(--text);
  transition:.2s;
}
.back-btn:hover{background:rgba(255,255,255,.1);}
.chat-avatar-mini{width:40px;height:40px;border-radius:12px;flex-shrink:0;overflow:hidden;}
.chat-hdr-info{flex:1;}
.chat-hdr-name{font-family:'Syne',sans-serif;font-weight:800;font-size:.95rem;letter-spacing:-.03em;}
.chat-hdr-status{font-size:.62rem;display:flex;gap:5px;align-items:center;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-top:1px;}
.status-icon{width:5px;height:5px;border-radius:50%;background:#34d399;box-shadow:0 0 6px #34d399;animation:pulse 2s infinite;}

.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
.msg{max-width:84%;animation:msgIn .22s ease;}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.user{align-self:flex-end;}
.msg.bot{align-self:flex-start;display:flex;gap:8px;align-items:flex-end;}
.msg-mini-avatar{width:28px;height:28px;border-radius:9px;flex-shrink:0;overflow:hidden;}
.bubble{padding:11px 15px;border-radius:18px;font-size:.84rem;line-height:1.65;}
.msg.user .bubble{
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:#000;font-weight:500;border-bottom-right-radius:4px;
  box-shadow:0 4px 20px rgba(244,162,97,.2);
}
.msg.bot .bubble{
  background:rgba(255,255,255,.06);
  backdrop-filter:blur(10px);
  color:var(--text);border:1px solid var(--border);
  border-bottom-left-radius:4px;
}
.msg-time{font-size:.56rem;color:var(--muted);margin-top:3px;padding:0 3px;font-family:'JetBrains Mono',monospace;}
.msg.user .msg-time{text-align:right;}
.typing .bubble{display:flex;gap:4px;align-items:center;padding:14px 16px;}
.dot{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:bounce .9s infinite;}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

.sugg-area{padding:6px 14px 10px;display:flex;flex-direction:column;gap:5px;}
.sugg-chip{
  background:rgba(255,255,255,.04);backdrop-filter:blur(10px);
  border:1px solid var(--border);border-radius:20px;
  padding:8px 14px;font-size:.78rem;cursor:pointer;
  transition:.2s;text-align:left;color:rgba(240,240,248,.6);
}
.sugg-chip:hover{border-color:rgba(244,162,97,.3);color:var(--text);background:rgba(244,162,97,.05);}

.input-wrap{
  padding:10px 14px;
  background:rgba(8,8,16,.9);backdrop-filter:blur(24px);
  border-top:1px solid rgba(255,255,255,.06);
  display:flex;gap:8px;align-items:flex-end;flex-shrink:0;
}
.msg-inp{
  flex:1;border:1.5px solid var(--border);border-radius:18px;
  padding:10px 16px;font-family:'DM Sans',sans-serif;
  font-size:.84rem;resize:none;outline:none;
  max-height:100px;background:rgba(255,255,255,.05);
  color:var(--text);line-height:1.45;transition:.2s;
}
.msg-inp:focus{border-color:rgba(244,162,97,.3);background:rgba(244,162,97,.03);}
.msg-inp::placeholder{color:#2a2a3a;}
.send-btn{
  width:40px;height:40px;border-radius:50%;border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:.9rem;flex-shrink:0;
  transition:.25s;color:#000;
  box-shadow:0 4px 16px rgba(244,162,97,.25);
}
.send-btn:hover{opacity:.88;transform:scale(1.08);}

.limit-bar{
  padding:8px 16px;display:flex;justify-content:space-between;
  align-items:center;border-top:1px solid rgba(255,255,255,.06);
  flex-shrink:0;font-size:.68rem;font-family:'JetBrains Mono',monospace;
}
.limit-bar.sofia-bar{color:var(--sofia);}
.limit-bar.marcus-bar{color:var(--marcus);}
.limit-bar.luna-bar{color:var(--luna);}
.limit-bar.alex-bar{color:var(--alex);}
.limit-upgrade{font-weight:600;cursor:pointer;text-decoration:underline;}

.locked-ov{
  position:absolute;inset:0;z-index:10;
  background:rgba(8,8,16,.96);backdrop-filter:blur(16px);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;padding:32px;
}
.locked-av{width:80px;height:80px;border-radius:20px;overflow:hidden;margin-bottom:16px;}
.locked-title{font-family:'Syne',sans-serif;font-weight:800;font-size:1.3rem;letter-spacing:-.04em;margin-bottom:8px;}
.locked-txt{font-size:.8rem;color:var(--muted);margin-bottom:24px;line-height:1.65;font-weight:300;}
.btn-unlock{
  padding:14px 32px;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  border:none;border-radius:14px;
  font-family:'Syne',sans-serif;font-weight:700;font-size:.9rem;
  color:#000;cursor:pointer;
  box-shadow:0 8px 32px rgba(244,162,97,.3);
}
.later-btn{margin-top:12px;font-size:.72rem;color:var(--muted);cursor:pointer;}

/* ── USER MENU ── */
.user-menu{
  position:fixed;top:58px;right:10px;z-index:400;
  background:rgba(18,18,30,.95);backdrop-filter:blur(24px);
  border:1px solid var(--border);border-radius:18px;padding:8px;
  box-shadow:0 24px 64px rgba(0,0,0,.6);
  display:none;min-width:210px;max-width:calc(480px - 20px);
}
.user-menu.open{display:block;}
.user-email{font-size:.65rem;color:var(--muted);padding:7px 12px 11px;border-bottom:1px solid var(--border);margin-bottom:6px;word-break:break-all;font-family:'JetBrains Mono',monospace;}
.menu-item{padding:10px 12px;border-radius:12px;font-size:.82rem;font-weight:500;cursor:pointer;transition:.15s;color:var(--text);}
.menu-item:hover{background:rgba(255,255,255,.06);}
.menu-item.danger{color:#f87171;}
